---
layout: default
---

<h1>{{ page.title }}</h1>

<ul style="line-height: 2; list-style: none; padding-left: 0; margin-left: 0;">
  {% for post in site.posts %}
    {% if post.tags contains page.tag or post.categories contains page.tag %}
      <li style="margin-bottom: 1em;">
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        <small style="color:#777;">({{ post.date | date: "%b %-d, %Y" }})</small>
      </li>
    {% endif %}
  {% endfor %}
</ul>
